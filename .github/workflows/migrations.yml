name: Migrations

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: paw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/paw_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - name: Migrate up
        run: mise run migrate:up

      - name: Migrate down (all)
        run: migrate -path db/migrations -database "$DATABASE_URL" down -all

      - name: Migrate up again (round-trip)
        run: mise run migrate:up
