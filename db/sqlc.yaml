---
version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # --- Money columns (BIGINT → nfce.Money) -----------------------
          - column: "receipts.subtotal"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipts.discount_amount"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipts.total_amount"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipts.approx_tax_total"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipt_items.unit_price"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipt_items.total_price"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipt_items.approx_tax_amount"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }
          - column: "receipt_payments.amount"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money" }

          # --- Tax amounts (nullable BIGINT → *nfce.Money) ---------------
          - column: "receipt_items.icms_base_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }
          - column: "receipt_items.icms_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }
          - column: "receipt_items.pis_base_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }
          - column: "receipt_items.pis_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }
          - column: "receipt_items.cofins_base_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }
          - column: "receipt_items.cofins_amount"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Money", pointer: true }

          # --- Tax rates (nullable BIGINT → *nfce.Rate) ------------------
          - column: "receipt_items.icms_rate"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Rate", pointer: true }
          - column: "receipt_items.pis_rate"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Rate", pointer: true }
          - column: "receipt_items.cofins_rate"
            nullable: true
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Rate", pointer: true }

          # --- Quantity (BIGINT → nfce.Quantity) -------------------------
          - column: "receipt_items.quantity"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "Quantity" }

          # --- Unit (TEXT → nfce.NormalizedUnit) -------------------------
          - column: "receipt_items.unit"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "NormalizedUnit" }

          # --- State (CHAR(2) → nfce.UF) ---------------------------------
          - column: "receipts.state"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "UF" }

          # --- Payment method enum (→ nfce.PaymentMethod) ----------------
          - column: "receipt_payments.method"
            go_type: { import: "github.com/glwbr/paw/nfce", type: "PaymentMethod" }

          # --- Timestamps (TIMESTAMPTZ → time.Time) ----------------------
          - db_type: "timestamptz"
            go_type: { import: "time", type: "Time" }

          # --- Integer columns (INT4 → int) ------------------------------
          - db_type: "pg_catalog.int4"
            go_type: { type: "int" }
